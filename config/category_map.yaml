# NSE category string -> bucket (ARCHITECTURE.md §5.4). Approved by Sravanth 27 Sep 2026
# (the draft built from 186 real categories: the live feed plus the spike API dumps), with
# his rule that Director and KMP changes form their own confounder class, `leadership`.
#
# What the buckets do (§5.4, §5.11):
#   order_win / order_candidate / catch_all  reach the order pipeline (downloads, D7)
#   red_flag        never an order; stored
#   results         counts as other news near an order; the revenue loader's filings
#   other_material  counts as other news near an order (contamination, §5.11)
#   leadership      Director/KMP changes: tagged as a separate confounder; the report shows
#                   results with and without events carrying it (Sravanth, 27 Sep 2026)
#   noise           ignored; never contamination
#
# When unsure a category went to other_material, not noise: that can only make the clean
# sample smaller, never credit a results move to an order.
#
# Matching is case-insensitive after §5.3's normalisation (trim, collapse spaces, strip
# "-XBRL" and "(Sub-para ...)"). A category not in this file is logged to
# `unknown_categories`, treated as other_material for contamination, and never downloaded.

order_win:
  - "Bagging/Receiving of orders/contracts"

order_candidate:

# Reg30 Radar as containers, wherever they run (ARCHITECTURE.md §9; D28: the VPS is gone and
# hosting is Sravanth's call at GATE 2, so nothing here assumes a particular host).
#
# One image, and ONE process that talks to NSE (D30): `live` polls and runs the order
# pipeline in the same loop, under the NSE lock. The old `collector` + `orders --follow`
# pair is retired. Publishes no ports.
#
#   docker compose up -d --build                        start or update live + sheets
#   docker compose logs -f live                         follow it
#   docker compose run --rm live python -m reg30_radar.common.migrate
#   docker compose --profile ops run --rm catchup       after downtime, BEFORE `up` (one
#                                                       NSE process at a time)
#   docker compose --profile ops run --rm backup        one pg_dump into ./backups (D14)
#
# Where the database is, is the one host-specific part, and lives in an override:
#   docker-compose.local-db.yml     a Postgres container next to the app (a rehearsal, or
#                                   a mini-PC / VM that holds its own data)
#   docker-compose.external-db.yml  an existing Postgres on an external Docker network
# Without either, DATABASE_URL in the env file must point at a server the containers reach.
#
# Values in ${...} come from the env file compose reads for substitution (--env-file).

name: reg30-radar

x-app: &app
  build: .
  image: reg30-radar:latest
  env_file: ${REG30_RADAR_ENV_FILE:-.env}
  restart: unless-stopped
  volumes:
    # data/ holds the NSE lock, in-flight PDFs (deleted after extraction, D8) and live
    # reports. One volume for every service, so the lock is shared and a second NSE
    # process refuses to start (common/nse_guard.py).
    - reg30-radar-data:/app/data
    # The Google service-account key, read-only. GOOGLE_SERVICE_ACCOUNT_FILE in the env
    # file must be the path inside the container: /app/secrets/<file>.json
    - ./secrets:/app/secrets:ro
  logging:
    driver: json-file
    options:
      max-size: "10m"   # §8
      max-file: "3"

services:
  live:
    <<: *app
    command: ["python", "-m", "reg30_radar.live"]
    # pdfplumber holds a page's objects in memory; a PDF larger than
    # nse.documents.max_bytes is refused before it is parsed.
    mem_limit: ${REG30_RADAR_LIVE_MEM:-512m}
    cpus: ${REG30_RADAR_LIVE_CPUS:-0.5}
    healthcheck:
      # Healthy means a poll succeeded in the last 30 minutes (common/health.py), not
      # merely that the process is alive.
      test: ["CMD", "python", "-m", "reg30_radar.common.health", "--max-age-minutes", "30"]
      interval: 5m
      timeout: 30s
      start_period: 2m
      retries: 2

  sheets:
    <<: *app
    command: ["python", "-m", "reg30_radar.sheets"]
    mem_limit: ${REG30_RADAR_SHEETS_MEM:-256m}
    cpus: ${REG30_RADAR_SHEETS_CPUS:-0.25}

  # The daily catch-up (one date-range request per day since the last successful poll).
  # One-off, never alongside `live`: stop live, run this, start live again.
  catchup:
    <<: *app
    profiles: ["ops"]
    restart: "no"
    command: ["python", "-m", "reg30_radar.catchup"]

  # One pg_dump into ./backups (D14). The client major version must be at least the
  # server's.
  backup:
    image: postgres:${REG30_RADAR_PG_MAJOR:-16}
    profiles: ["ops"]
    env_file: ${REG30_RADAR_ENV_FILE:-.env}
    restart: "no"
    volumes:
      - ./backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - 'pg_dump --format=custom --dbname="$$DATABASE_URL" --file="/backups/tradebot_$$(date +%Y%m%d_%H%M%S).dump"'

volumes:
  reg30-radar-data:

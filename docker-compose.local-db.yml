# A Postgres container next to the app: for a local rehearsal, or a host that keeps its
# own data (GATE 2). Its port is not published; only the app containers reach it.
#
#   docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.local-db.yml up -d --build
#
# The env file (gitignored, from .env.docker.example) sets REG30_RADAR_LOCAL_DB_PASSWORD;
# compose builds DATABASE_URL from it below, so the password is written in one place only.

x-local-db: &local-db
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    DATABASE_URL: postgresql://tradebot:${REG30_RADAR_LOCAL_DB_PASSWORD:?set it in the env file}@postgres:5432/tradebot

services:
  postgres:
    image: postgres:${REG30_RADAR_PG_MAJOR:-16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradebot
      POSTGRES_DB: tradebot
      POSTGRES_PASSWORD: ${REG30_RADAR_LOCAL_DB_PASSWORD:?set it in the env file}
    volumes:
      - reg30-radar-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tradebot", "-d", "tradebot"]
      interval: 5s
      timeout: 5s
      retries: 20

  live:
    <<: *local-db
  sheets:
    <<: *local-db
  catchup:
    <<: *local-db
  backup:
    <<: *local-db

volumes:
  reg30-radar-pg:

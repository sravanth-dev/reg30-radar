# Model IDs and prices are copied by hand from OpenAI's pricing page and never guessed
# (ARCHITECTURE.md Sect.6).
#
# tier1_model and ocr_model were set 24 Sep 2026 (night, continued) by Sravanth directly,
# ahead of the Spike D bake-off below, so the first order-extraction run could go live the
# same day. This is his call, not a measurement - the bake-off still stands as the way to
# confirm or revise it once ~50 labelled PDFs exist (Sect.6).

tier1_model: gpt-6-luna
tier2_model: PLACEHOLDER   # unset - single tier for now (Sect.6: "if one model is enough,
                           # use a single tier"). May change once the bake-off runs.

# §5.5 Part B, pulled forward from Slice 5: the vision model that transcribes a page no
# other method could read. A separate slot from tier1/tier2 because it does a different
# job (verbatim transcription, not extraction or triage) and is gated by its own cap below.
ocr_model: gpt-6-luna
ocr_max_pages_per_document: 10   # a spend guard: one pathological PDF cannot trigger
                                  # unlimited vision calls (§5.5 Part B)

# USD per million tokens, keyed by model id. Copied from the pricing page, never from memory.
prices:
  gpt-6-luna:
    input: 0.10
    output: 0.50

caps:
  # Set 24 Sep 2026 (night, continued) by Sravanth directly, so the first day's ~124-filing
  # run could proceed - estimated well under $0.10 at gpt-6-luna's prices, so $1 leaves
  # real headroom while still being a hard ceiling. Enforced separately per purpose
  # (Sect.6): a filing that needs both OCR and extraction draws from both caps.
  live_usd_per_month: 1.0
  ocr_usd_per_month: 1.0
  # Still unset: the Batch-API backfill (Slice 8) hasn't run. A null cap fails closed,
  # never open (Sect.6) - the client refuses a paid call while its cap is null.
  backfill_usd_per_run: null

bakeoff:
  # Spike D, still to run: four arms on the 10 labelled PDFs, reporting per-field
  # accuracy, tokens, cost per document, and every failure. Confirms or revises the
  # tier1_model/ocr_model choice above once ~50 labelled PDFs exist.
  hard_stop_usd: 0.50
  arms:
    - annexure_parser_only   # no model at all; also measures the parser's hit rate,
                             # which is the number that sets the entire LLM bill
    - PLACEHOLDER_gpt5_nano
    - PLACEHOLDER_gpt41_mini
    - PLACEHOLDER_luna

# Every task sets a maximum output length (Sect.6).
max_output_tokens:
  triage: 200
  order_extract: 800
  ocr_transcribe: 2000   # a page of dense tabular text, transcribed verbatim, runs long

batch:
  # Backfill LLM work goes through the Batch API; live processing does not.
  # The cached-input discount is deliberately excluded from the cost model.
  enabled: true
  assume_cache_discount: false

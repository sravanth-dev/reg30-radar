# Endpoints, headers and parameters live here, never in code (CLAUDE.md scraping rules).
#
# Politeness is policy, not decoration (D25): one request at a time per source, a fixed
# low rate with jitter, a session warm-up first, backoff on errors, and a single
# consistent User-Agent that is never rotated. Nothing here exists to defeat NSE's bot
# management; the pacing exists to keep load negligible.

nse:
  # A warm-up GET here first, to pick up the Akamai cookies (AKA_A2, _abck, ak_bmsc,
  # bm_sz). The archive and API hosts will not answer a cold session.
  warmup_url: https://www.nseindia.com/companies-listing/corporate-filings-announcements

  headers:
    # Copied from the request the announcements page itself makes. Chosen once and kept
    # stable: rotating these is exactly the pattern bot management scores hardest (D25).
    accept: "*/*"
    accept-language: "en-IN,en-GB;q=0.9,en-US;q=0.8,en;q=0.7"
    priority: "u=1, i"
    referer: https://www.nseindia.com/companies-listing/corporate-filings-announcements
    sec-ch-ua: '"Google Chrome";v="153", "Not_A Brand";v="8", "Chromium";v="153"'
    sec-ch-ua-mobile: "?0"
    sec-ch-ua-platform: '"Windows"'
    sec-fetch-dest: empty
    sec-fetch-mode: cors
    sec-fetch-site: same-origin
    user-agent: >-
      Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko)
      Chrome/153.0.0.0 Safari/537.36

  announcements:
    url: https://www.nseindia.com/api/corporate-announcements
    # index=equities is the only parameter confirmed so far. Symbol and date-range
    # parameter names are what Spike A is for; nothing is assumed here.
    params:
      index: equities

  # Verified in Spike C (27 Sep 2026): the "Financial Results" era only - its data stops
  # around NSE's April 2025 "Integrated Filing" cutover (§5.8). That regime's own endpoint
  # is still unknown.
  results:
    url: https://www.nseindia.com/api/corporates-financial-results
    params:
      index: equities
      period: Quarterly

  # Found from a real browser capture (Sravanth, 27 Sep 2026): a detail view for one
  # listing row, not yet confirmed to reach past the April-2025 cutover (§5.8). Its
  # parameters are copied straight from that row's own fields (`params`, `seqNumber`,
  # `industry`, `oldNewFlag` -> frOldNewFlag, `reInd` -> ind, `format`), so this endpoint
  # is only ever called with values a `results` listing row already supplied - never
  # constructed from scratch.
  results_detail:
    url: https://www.nseindia.com/api/corporates-financial-results-data
    params:
      index: equities

  # The post-April-2025 "Integrated Filing - Financials" results (ARCHITECTURE §5.8). Found
  # from Sravanth's capture of NSE's Integrated Filing page and verified by Spike C2 (27 Sep
  # 2026): answers a warmed-up script session, the page's `issuer` parameter is not needed
  # (same bytes without it), and BEL's 12 rows reach back to the quarter ended 31-Mar-2025,
  # where the `results` listing above stops at 31-Dec-2024. Returns {data, totalCount}.
  integrated_results:
    url: https://www.nseindia.com/api/integrated-filing-results
    params:
      index: equities
      period_ended: all
      type: Integrated Filing- Financials
      page: 1
      size: 20

  # Verified in Spike B (ARCHITECTURE.md Sect.5.2, Sect.5.9).
  archives:
    udiff_cm: https://nsearchives.nseindia.com/content/cm/BhavCopy_NSE_CM_0_0_0_{yyyymmdd}_F_0000.csv.zip
    # Note the two-digit year in the PR URL, while the members inside use four digits.
    pr_bundle: https://nsearchives.nseindia.com/archives/equities/bhavcopy/pr/PR{ddmmyy}.zip
    # PR members are matched case-insensitively on prefix, never on an exact filename:
    # the 2025 bundles mix capitalisation and mix DDMMYY with DDMMYYYY inside one zip.
    pr_members:
      announcements: an
      price_data: pd
      market_cap: mcap
      band_hitters: bh
    # Price-band history (ARCHITECTURE §11, 27 Sep 2026): the current band per symbol, and
    # one change log per calendar day (a clean 404 on a day with no change).
    sec_list: https://nsearchives.nseindia.com/content/equities/sec_list.csv
    band_changes: https://nsearchives.nseindia.com/content/equities/eq_band_changes_{ddmmyyyy}.csv

  documents:
    # Attachment downloads (ARCHITECTURE Sect.5.5). The ceiling is not decoration: the
    # worker runs under mem_limit 512m beside n8n on a 2-vCPU box (Sect.9), and pdfplumber
    # holds a page's objects in memory while parsing, so one unexpectedly large file is the
    # single download that can take the container down. A capped stream turns that into a
    # recorded refusal instead of an OOM kill.
    max_bytes: 26214400      # 25 MiB. The largest in the labelled set is ~7 MB.
    chunk_bytes: 65536

  pacing:
    # ARCHITECTURE.md D6 (revised 23 Sep 2026) and Sect.5.1.
    #
    # Three bands on a trading day, because filings do not stop when the market does.
    # Measured on 17 and 21 Sep 2026 and again live on 23 Sep: roughly two thirds of a
    # day's filings arrive AFTER 16:00, and the single busiest hour is 17:00 - companies
    # file when the board meeting ends, not when trading closes. So the post-close window
    # is slower than the trading window but nowhere near idle.
    #
    # Anything outside every band, and any non-trading day, uses off_window_seconds.
    bands:
      - {from: "08:00", to: "15:30", seconds: 60}    # continuous trading
      - {from: "15:30", to: "22:00", seconds: 180}   # post-close: where most filings land
    off_window_seconds: 600

    # Used by the overflow catch-up re-poll as well as the backfill: the fastest rate this
    # project ever asks of NSE.
    backfill_min_gap_seconds: 3.0
    # The floor between ANY two requests in the live path, warm-up and first call included
    # (brief, 20 Oct 2026). Enforced across hosts by common/nse_guard.py.
    live_min_gap_seconds: 2.0

    # Pooled connections idle longer than this are closed before the next request.
    # NSE drops idle connections after a few minutes, and reusing a dead one fails
    # with ConnectionResetError: on 26 Sep 2026, 34 of 61 ten-minute polls failed that
    # way (WORKLOG, 27 Sep). Kept above the 60 s band, where reuse always worked.
    idle_reconnect_seconds: 90
    jitter_seconds: [0.4, 1.6]

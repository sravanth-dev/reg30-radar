# tradebot on the VPS (ARCHITECTURE.md §9; D19 as widened 27 Sep 2026): the three live
# processes as three services built from one image. Runbook: DEPLOY.md.
#
#   docker compose up -d --build                     start or update all three
#   docker compose logs -f collector                 follow one service
#   docker compose run --rm collector python -m tradebot.common.migrate
#   docker compose --profile ops run --rm backup     one pg_dump into ./backups (ops/backup.sh)
#
# Publishes no ports. The database is the existing Postgres, reached over its own external
# Docker network. Nothing here touches n8n's containers (CLAUDE.md rule 7): the backup job
# runs pg_dump from its own container over that network instead of `docker exec` into
# the Postgres container.
#
# Values in ${...} come from .env, which compose also reads for substitution.

name: tradebot

x-app: &app
  build: .
  image: tradebot:latest
  env_file: .env
  restart: unless-stopped
  networks: [db]
  volumes:
    - tradebot_data:/app/data
    # The Google service-account key, read-only. GOOGLE_SERVICE_ACCOUNT_FILE in .env must
    # be the path inside the container: /app/secrets/<file>.json
    - ./secrets:/app/secrets:ro
  logging:
    driver: json-file
    options:
      max-size: "10m"   # §8
      max-file: "3"

services:
  collector:
    <<: *app
    command: ["python", "-m", "tradebot.collector"]
    mem_limit: ${TRADEBOT_COLLECTOR_MEM:-256m}
    cpus: ${TRADEBOT_COLLECTOR_CPUS:-0.25}
    healthcheck:
      # Healthy means a poll succeeded in the last 30 minutes (common/health.py), not
      # merely that the process is alive.
      test: ["CMD", "python", "-m", "tradebot.common.health", "--max-age-minutes", "30"]
      interval: 5m
      timeout: 30s
      start_period: 2m
      retries: 2

  orders:
    <<: *app
    command: ["python", "-m", "tradebot.orders", "--follow"]
    # pdfplumber holds a page's objects in memory; 512m is §9's ceiling, and a PDF larger
    # than nse.documents.max_bytes is refused before it is parsed.
    mem_limit: ${TRADEBOT_ORDERS_MEM:-512m}
    cpus: ${TRADEBOT_ORDERS_CPUS:-0.5}

  sheets:
    <<: *app
    command: ["python", "-m", "tradebot.sheets"]
    mem_limit: ${TRADEBOT_SHEETS_MEM:-256m}
    cpus: ${TRADEBOT_SHEETS_CPUS:-0.25}

  # One-off pg_dump of the tradebot database into ./backups, run by ops/backup.sh (D14).
  # The client major version must be at least the server's (DEPLOY.md, Spike E).
  backup:
    image: postgres:${TRADEBOT_PG_MAJOR:-16}
    profiles: ["ops"]
    env_file: .env
    networks: [db]
    restart: "no"
    volumes:
      - ./backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - 'pg_dump --format=custom --dbname="$$DATABASE_URL" --file="/backups/tradebot_$$(date +%Y%m%d_%H%M%S).dump"'

networks:
  db:
    external: true
    name: ${TRADEBOT_DB_NETWORK:?set TRADEBOT_DB_NETWORK in .env to the Postgres container's Docker network}

volumes:
  tradebot_data:
